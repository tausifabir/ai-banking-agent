spring.application.name=ai-banking-agent

## H2 config
spring.datasource.url=jdbc:h2:file:./data/bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

## Enable H2 console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Ensure data.sql (schema bootstrap) is executed on startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:data.sql

## Multipart limits (matched against banking.upload.max-file-size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

## Banking controller configuration
banking.upload.max-file-size=5242880
banking.upload.allowed-mime-types=pdf,image

## LLM client (Ollama)
banking.llm.base-url=http://localhost:11434
banking.llm.model=llama3.1
banking.llm.timeout-seconds=15
banking.llm.connect-timeout-seconds=10

## Agent loop bounds
banking.agent.max-iterations=3
banking.agent.total-budget-seconds=60

#spring.ai.openai.api-key=
#spring.ai.openai.base-url=https://api.openai.com/v1  # optional, defaults to OpenAI's endpoint
